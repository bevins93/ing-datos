[project]
name = "reset-report"
version = "0.1.0"
description = "Pipeline que genera tabla_reporte_bot.csv a partir de los logs diarios del bot de reseteo de contrasenas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reset-report = "reset_report.cli:main"
reset-report-filter = "reset_report.filter_by_accion:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reset_report"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["reset_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
